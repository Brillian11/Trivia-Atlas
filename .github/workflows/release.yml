name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0). Leave empty to derive from app versionName.'
        required: false
        default: ''
      prerelease:
        description: 'Mark release as pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release-apk:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Determine release tag & metadata
        id: meta
        shell: bash
        run: |
          APP_VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          APP_VERSION=${APP_VERSION:-1.0}

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ inputs.tag_name }}"
            TAG="${INPUT_TAG:-v${APP_VERSION}}"
            IS_PRERELEASE="${{ inputs.prerelease }}"
            RELEASE_TITLE="Trivia Atlas ${TAG}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            IS_PRERELEASE="false"
            RELEASE_TITLE="Trivia Atlas ${TAG}"
          else
            TAG="latest"
            IS_PRERELEASE="true"
            RELEASE_TITLE="Trivia Atlas Latest Build (v${APP_VERSION})"
          fi

          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Prepare debug keystore & optional release secrets
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          fi

          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "HAS_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "HAS_RELEASE_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build Signed Release APK (when signing secrets are configured)
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Package APK artifacts & checksums
        shell: bash
        run: |
          mkdir -p dist
          TAG="${{ steps.meta.outputs.tag }}"

          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -z "$DEBUG_APK" ]; then
            echo "Debug APK not found!"
            exit 1
          fi
          cp "$DEBUG_APK" "dist/TriviaAtlas-${TAG}-debug.apk"

          if [ "$HAS_RELEASE_SIGNING" = "true" ]; then
            RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
            if [ -n "$RELEASE_APK" ]; then
              cp "$RELEASE_APK" "dist/TriviaAtlas-${TAG}-release.apk"
            fi
          fi

          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      - name: Build Changelog for Release Page
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          CLEAN_VER="${TAG#v}"

          {
            echo "## What's New in ${TAG}"
            echo ""
            if [ -f CHANGELOG.md ]; then
              if [ "$TAG" = "latest" ]; then
                UNRELEASED=$(awk '
                  /^## \[Unreleased\]/ { in_sec=1; next }
                  /^## \[/ { if (in_sec) exit }
                  in_sec { print }
                ' CHANGELOG.md | sed -e '/./,$!d')
                LATEST_RELEASE=$(awk '
                  /^## \[/ {
                    if (in_sec) exit
                    if ($0 !~ /\[Unreleased\]/) {
                      in_sec=1
                      print
                      next
                    }
                  }
                  in_sec { print }
                ' CHANGELOG.md | sed -e '/./,$!d')

                if [ -n "$UNRELEASED" ]; then
                  echo "### Latest Changes"
                  echo "$UNRELEASED"
                  echo ""
                fi
                if [ -n "$LATEST_RELEASE" ]; then
                  echo "$LATEST_RELEASE"
                  echo ""
                fi
              else
                SECTION=$(awk -v ver="$CLEAN_VER" '
                  /^## \[/ {
                    if (in_sec) exit
                    if ($0 ~ "\\[" ver "(\\.0)*\\]") {
                      in_sec=1
                      next
                    }
                  }
                  in_sec { print }
                ' CHANGELOG.md | sed -e '/./,$!d')

                if [ -z "$SECTION" ]; then
                  SECTION=$(awk '
                    /^## \[/ {
                      if (in_sec) exit
                      if ($0 !~ /\[Unreleased\]/) {
                        in_sec=1
                        next
                      }
                    }
                    in_sec { print }
                  ' CHANGELOG.md | sed -e '/./,$!d')
                fi

                if [ -n "$SECTION" ]; then
                  echo "$SECTION"
                  echo ""
                fi
              fi
            fi

            echo "### Commit History"
            PREV_TAG=$(git describe --tags --abbrev=0 --exclude="$TAG" --exclude="latest" 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              echo "_Changes since \`${PREV_TAG}\`:_"
              git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s (\`%h\`)" | head -n 30
            else
              git log -n 15 --no-merges --pretty=format:"- %s (\`%h\`)"
            fi
            echo ""
            echo ""
            echo "### Attached APK Checksums (SHA-256)"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > release_notes.md

          cat release_notes.md

      - name: Move rolling 'latest' tag when building from main branch
        if: steps.meta.outputs.tag == 'latest'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest HEAD
          git push -f origin latest

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriviaAtlas-${{ steps.meta.outputs.tag }}-apks
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release with Changelog & APK files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_title }}
          body_path: release_notes.md
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.prerelease != 'true' }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
